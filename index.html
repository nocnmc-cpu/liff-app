<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIFF Form</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; text-align: center; background-color: #f7f7f7; }
    .container { max-width: 400px; margin: 40px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; font-size: 16px; }
    input { border: 1px solid #ccc; border-radius: 5px; }
    button { background-color: #06C755; color: white; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <h2>ส่งข้อความผ่าน LIFF</h2>
    <input type="text" id="userInput" placeholder="พิมพ์ข้อความที่ต้องการส่ง..." required>
    <button type="button" onclick="submitData()">ส่งข้อความเข้าแชท</button>
  </div>

  <script>
    // ⚠️ ใส่ LIFF ID ของคุณที่นี่
    const LIFF_ID = "2012181427-IWrdgKMW"; 

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        }
      } catch (error) {
        alert("LIFF Init Error: " + error.message);
      }
    }
    main();

    async function submitData() {
      const inputText = document.getElementById("userInput").value;
      if (!inputText) {
        alert("กรุณากรอกข้อความก่อนส่ง");
        return;
      }

      try {
        // ตรวจสอบว่าเปิดผ่านแอป LINE และรองรับการส่งข้อความไหม
        if (!liff.isInClient()) {
          alert("กรุณาเปิดผ่านแอปพลิเคชัน LINE เท่านั้น");
          return;
        }

        // สั่งส่งข้อความเข้าแชทปัจจุบันทันที
        await liff.sendMessages([
          {
            type: 'text',
            text: inputText
          }
        ]);

        alert("ส่งข้อความเข้าแชทสำเร็จ!");
        liff.closeWindow(); // ปิดหน้า LIFF ทันที

      } catch (error) {
        alert("ส่งข้อความไม่สำเร็จ: " + error.message);
      }
    }
  </script>
</body>
</html>
