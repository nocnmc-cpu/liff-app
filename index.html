<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIFF Form</title>
  <!-- นำเข้า LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; text-align: center; background-color: #f7f7f7; }
    .container { max-width: 400px; margin: 40px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; font-size: 16px; }
    input { border: 1px solid #ccc; border-radius: 5px; }
    button { background-color: #06C755; color: white; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
    button:hover { background-color: #05b34c; }
  </style>
</head>
<body>

  <div class="container">
    <h2>ส่งข้อความผ่าน LIFF</h2>
    <input type="text" id="userInput" placeholder="พิมพ์ข้อความที่ต้องการส่ง..." required>
    <button type="button" onclick="submitData()">ส่งข้อมูล</button>
  </div>

  <script>
    // ⚠️ [สำคัญ] นำ LIFF ID และ Google Apps Script Web App URL ของคุณมาใส่ตรงนี้
    const LIFF_ID = "2012181427-IWrdgKMW"; 
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw6LX0yR0UrUqo__4tusugeg-08t2y3bNELak4uqZWoqSuWvMiRBapTc2TyfxodykQr/exec"; 

    // เริ่มต้นการใช้งาน LIFF SDK
    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        }
      } catch (error) {
        console.error("LIFF Initialization failed", error);
      }
    }
    main();

    // ฟังก์ชันส่งข้อมูลเมื่อผู้ใช้กดปุ่ม
    async function submitData() {
      const inputText = document.getElementById("userInput").value;
      if (!inputText) {
        alert("กรุณากรอกข้อความก่อนส่ง");
        return;
      }

      try {
        // ดึง Profile ของผู้ใช้งานที่กำลังเปิด LIFF
        const profile = await liff.getProfile();

        // ส่งข้อมูลไปที่ Google Apps Script Web App
        await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            userId: profile.userId,
            userName: profile.displayName,
            message: inputText
          })
        });

        alert("ส่งข้อมูลสำเร็จ! LINE OA จะส่งข้อความยืนยันกลับไปครับ");
        liff.closeWindow(); // ปิดหน้าต่าง LIFF ทันที

      } catch (error) {
  console.error("Error:", error);
  alert("Error จริงๆ คือ: " + error.toString());
      }
    }
  </script>
</body>
</html>
